name: tests

# Runs on every push and pull request. Merge to `staging` / `main` only when green.
on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ihr
          POSTGRES_PASSWORD: ihr
          POSTGRES_DB: ihr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ihr"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: ihr
      DB_PASSWORD: ihr

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"          # same as the production Docker image
          extensions: pdo_pgsql, gd, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Security advisories
        run: composer audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
